[project]
name = "policy-robustness-sweep"
version = "0.0.1"
description = "One Policy, 400 Worlds — quadruped failure-boundary sweep with a live probe artifact (Poisson Labs flagship)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Taylor Kolasinski", email = "work@poissonlabs.ai" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "modal>=1.5.4",
    "pydantic>=2.13.4",
    "rerun-sdk==0.36.0",
    "scipy>=1.18.0",
]

[project.urls]
Homepage = "https://github.com/poisson-labs/policy-robustness-sweep"
Issues = "https://github.com/poisson-labs/policy-robustness-sweep/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pyright]
# Strict on the dirs that hold (or will hold) the config schema, stats code, and CI checks
# (kickoff §4: strict-ish on configs/, reduce/, and stats code at minimum).
include = ["configs", "reduce", "ci", "tests", "app"]
# The Modal/FastAPI shell is untyped by nature (Modal decorators, decorator-registered
# route handlers); the logic it wraps (app/core.py) is fully strict + contract-tested.
exclude = ["app/server.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
